version: '3.8'
services:
  sse:
    image: kjungw/pickeat:release
    container_name: sse
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./data/springboot/logs:/var/logs
    environment:
      SPRING_ACTIVE_PROFILE: prod
    networks:
      - app-tier

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    ports:
      - "12345:12345"
    volumes:
      - ./data/springboot/logs:/var/log/spring
      - ./data/alloy/config.alloy:/etc/alloy/config.alloy
      - ./data/alloy/state:/var/lib/alloy
    environment:
      - ALLOY_ENV=prod
    networks:
      - app-tier

networks:
  app-tier:
    driver: bridge
